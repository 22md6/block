<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>وكع البلوك - الشارع العراقي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        /* UI Overlay */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 15px;
            color: #fff;
            backdrop-filter: blur(5px);
            border: 2px solid #f39c12;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        .game-title {
            font-size: 22px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 2px 2px 4px #000;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .aim-instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #00ffcc;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 10px rgba(0,255,204,0.3);
            animation: pulse 1.5s infinite;
            pointer-events: none;
        }
        @keyframes pulse {
            0% { opacity: 0.7; transform: translateX(-50%) scale(0.98); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.02); }
            100% { opacity: 0.7; transform: translateX(-50%) scale(0.98); }
        }
        /* Modals */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: auto;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal.active {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            border: 3px solid #f1c40f;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 90%;
            width: 350px;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.4);
        }
        .modal-title {
            font-size: 28px;
            margin-bottom: 15px;
            color: #fff;
        }
        .modal-msg {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #e74c3c;
            line-height: 1.4;
        }
        .win-msg {
            color: #2ecc71;
        }
        .btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 0 #1e8449;
            transition: all 0.1s;
            margin: 8px;
            width: 100%;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #1e8449;
        }
        .btn-retry {
            background: #e67e22;
            box-shadow: 0 5px 0 #d35400;
        }
        .btn-retry:active {
            box-shadow: 0 1px 0 #d35400;
        }
    </style>
    <!-- Three.js & Cannon.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

    <div id="game-container">
        <div id="canvas-container"></div>

        <div class="ui-layer">
            <div class="header">
                <div class="game-title">وكع البلوك 🧱</div>
                <div class="stats">
                    <div class="stat-box" id="level-display">المستوى: 1</div>
                    <div class="stat-box" id="ammo-display">الأحجار: 5</div>
                </div>
            </div>
            <div class="aim-instruction">🎯 اسحب الحجر للأسفل ثم اترك لإطلاق النار بدقة</div>
        </div>

        <!-- Result Modal -->
        <div class="modal" id="result-modal">
            <div class="modal-content">
                <div class="modal-title" id="modal-title">النتيجة</div>
                <div class="modal-msg" id="modal-msg">---</div>
                <button class="btn" id="modal-btn">ابدأ اللعبة</button>
            </div>
        </div>
    </div>

    <script>
        // Audio Synthesizer
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'shoot') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(261.63, now);
                osc.frequency.setValueAtTime(329.63, now + 0.1);
                osc.frequency.setValueAtTime(392.00, now + 0.2);
                osc.frequency.setValueAtTime(523.25, now + 0.3);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start();
                osc.stop(now + 0.5);
            } else if (type === 'fail') {
                const now = audioCtx.currentTime;
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start();
                osc.stop(now + 0.4);
            }
        }

        // Game Variables
        let currentLevel = 1;
        let ammo = 5;
        let maxAmmo = 5;
        let gameActive = true;
        let targets = [];
        let activeStones = [];
        let trajectoryLine;
        let cannonMesh, currentStoneMesh;

        // ThreeJS & Cannon Variables
        let scene, camera, renderer, world;

        // Interaction & Aiming
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };
        const slingPos = new THREE.Vector3(0, 0.8, 7.5); // مرئي ومكان واضح في الأسفل

        const winMessages = ["أحسنت ابن المطي! 👏", "ممتاز يا حيوان! 🎉"];
        const failMessage = "طيح الله حظك! 💩";

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.012);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.2, 11); // زاوية متميزة ترى المدفع والحجر والأهداف بوضوح
            camera.lookAt(0, 2.8, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Physics World
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.NaiveBroadphase();
            world.defaultContactMaterial.friction = 0.4;
            world.defaultContactMaterial.restitution = 0.2;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xfff5d6, 1.3);
            sunLight.position.set(10, 20, 15);
            sunLight.castShadow = true;
            scene.add(sunLight);

            // Trajectory Line Setup
            const lineMat = new THREE.LineDashedMaterial({
                color: 0xff3300,
                dashSize: 0.25,
                gapSize: 0.15,
                linewidth: 4
            });
            const lineGeo = new THREE.BufferGeometry();
            trajectoryLine = new THREE.Line(lineGeo, lineMat);
            scene.add(trajectoryLine);

            // Build Environment & Cannon Weapon
            createIraqiStreet();
            createVisibleCannon();

            // Listeners
            window.addEventListener('resize', onWindowResize);
            setupInput();

            // Load First Level
            loadLevel(1);

            // Loop
            animate();
        }

        // Iraqi Festive Street & Rusty Table
        function createIraqiStreet() {
            // Road Ground
            const roadGeo = new THREE.PlaneGeometry(100, 100);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x3b3b3b, roughness: 0.9 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.receiveShadow = true;
            scene.add(road);

            const roadBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
            roadBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(roadBody);

            // Colorful Houses
            const colors = [0xe74c3c, 0xf1c40f, 0x2ecc71, 0x3498db, 0x9b59b6, 0xe67e22];
            for (let i = -40; i <= 40; i += 8) {
                if (Math.abs(i) < 8) continue;
                const houseGeo = new THREE.BoxGeometry(7, 10 + Math.random() * 4, 10);
                const houseMat = new THREE.MeshStandardMaterial({
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
                const house = new THREE.Mesh(houseGeo, houseMat);
                house.position.set(i, 5, -12);
                scene.add(house);
            }

            // Palm Trees
            for (let i = -15; i <= 15; i += 30) {
                const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 7, 8);
                const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.set(i, 3.5, -5);

                const leafGroup = new THREE.Group();
                for (let l = 0; l < 6; l++) {
                    const leafGeo = new THREE.ConeGeometry(1.5, 4, 4);
                    const leafMat = new THREE.MeshStandardMaterial({ color: 0x27ae60 });
                    const leaf = new THREE.Mesh(leafGeo, leafMat);
                    leaf.rotation.x = Math.PI / 3;
                    leaf.rotation.y = (l * Math.PI) / 3;
                    leaf.position.y = 3.5;
                    leafGroup.add(leaf);
                }
                trunk.add(leafGroup);
                scene.add(trunk);
            }

            // Rusty Iron Table (ميز حديد صدأ)
            const tableGroup = new THREE.Group();
            const topGeo = new THREE.BoxGeometry(5.5, 0.3, 2.8);
            const rustMat = new THREE.MeshStandardMaterial({ color: 0x4a2306, roughness: 0.85, metalness: 0.7 }); // مظهر صدأ وتأكسد
            const top = new THREE.Mesh(topGeo, rustMat);
            top.position.y = 2.5;
            top.castShadow = true;
            top.receiveShadow = true;
            tableGroup.add(top);

            const legGeo = new THREE.CylinderGeometry(0.12, 0.12, 2.5);
            const legPositions = [[-2.5, 1.25, -1.1], [2.5, 1.25, -1.1], [-2.5, 1.25, 1.1], [2.5, 1.25, 1.1]];
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, rustMat);
                leg.position.set(...pos);
                leg.castShadow = true;
                tableGroup.add(leg);
            });
            scene.add(tableGroup);

            const tableBody = new CANNON.Body({ mass: 0 });
            tableBody.addShape(new CANNON.Box(new CANNON.Vec3(2.75, 0.15, 1.4)), new CANNON.Vec3(0, 2.5, 0));
            world.addBody(tableBody);
        }

        // Create Visible Cannon & Stone in Front of Player
        function createVisibleCannon() {
            const cannonGroup = new THREE.Group();

            // Base Stand
            const baseGeo = new THREE.BoxGeometry(1.2, 0.4, 1.5);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, metalness: 0.5 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.position.set(0, 0.2, 0);
            cannonGroup.add(base);

            // Barrel (المدفع)
            const barrelGeo = new THREE.CylinderGeometry(0.45, 0.55, 2.2, 16);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x1abc9c, metalness: 0.8, roughness: 0.2 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 2.5; // موجه للأعلى نحو الأهداف
            barrel.position.set(0, 0.8, -0.5);
            cannonGroup.add(barrel);

            cannonGroup.position.copy(slingPos);
            cannonGroup.position.z += 0.8;
            scene.add(cannonGroup);
            cannonMesh = cannonGroup;

            // Spawn Ready Stone (حجر مرئي جاهز للإطلاق)
            spawnReadyStone();
        }

        function spawnReadyStone() {
            if (currentStoneMesh) scene.remove(currentStoneMesh);
            const geo = new THREE.DodecahedronGeometry(0.42, 1);
            const mat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.95 });
            currentStoneMesh = new THREE.Mesh(geo, mat);
            currentStoneMesh.position.copy(slingPos);
            currentStoneMesh.castShadow = true;
            scene.add(currentStoneMesh);
        }

        // Level Generation (1 to 100)
        function loadLevel(lvl) {
            currentLevel = lvl;
            maxAmmo = Math.max(3, 6 - Math.floor(lvl / 25));
            ammo = maxAmmo;
            gameActive = true;

            document.getElementById('level-display').innerText = `المستوى: ${currentLevel}`;
            document.getElementById('ammo-display').innerText = `الأحجار: ${ammo}`;

            // Clean Targets
            targets.forEach(t => {
                scene.remove(t.mesh);
                world.remove(t.body);
            });
            targets = [];

            // Clean active flying stones
            activeStones.forEach(s => {
                scene.remove(s.mesh);
                world.remove(s.body);
            });
            activeStones = [];

            spawnReadyStone();

            // Build pyramid/structure on rusty table (y starting at 2.7)
            const startY = 2.75;
            const rows = Math.min(6, 2 + Math.floor(lvl / 15));
            const cols = Math.min(5, 2 + Math.floor(lvl / 20));

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = (c - (cols - 1) / 2) * 0.85;
                    const y = startY + r * 0.75;
                    const z = (Math.random() - 0.5) * 0.4;

                    let type = 'can'; // علبة طماطم ومعلبات مفتوحة
                    if (lvl > 10 && (r + c) % 2 === 0) type = 'brick'; // طابوق فخاري
                    if (lvl > 30 && r % 2 === 1) type = 'block'; // بلوك أسمنتي ثقيل

                    createTarget(x, y, z, type);
                }
            }
        }

        function createTarget(x, y, z, type) {
            let mesh, body, mass, shape;

            if (type === 'can') {
                const geo = new THREE.CylinderGeometry(0.28, 0.28, 0.65, 16);
                const mat = new THREE.MeshStandardMaterial({ color: 0xd35400, metalness: 0.6, roughness: 0.3 }); // علبة طماطم
                mesh = new THREE.Mesh(geo, mat);
                mass = 1.2;
                shape = new CANNON.Cylinder(0.28, 0.28, 0.65, 16);
            } else if (type === 'brick') {
                const geo = new THREE.BoxGeometry(0.75, 0.38, 0.38);
                const mat = new THREE.MeshStandardMaterial({ color: 0xa93226, roughness: 0.85 }); // طابوق أحمر
                mesh = new THREE.Mesh(geo, mat);
                mass = 2.5;
                shape = new CANNON.Box(new CANNON.Vec3(0.37, 0.19, 0.19));
            } else {
                const geo = new THREE.BoxGeometry(0.85, 0.45, 0.45);
                const mat = new THREE.MeshStandardMaterial({ color: 0x5d6d7e, roughness: 0.9 }); // بلوك أسمنتي
                mesh = new THREE.Mesh(geo, mat);
                mass = 4.5;
                shape = new CANNON.Box(new CANNON.Vec3(0.42, 0.225, 0.225));
            }

            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            body = new CANNON.Body({ mass: mass, shape: shape });
            body.position.set(x, y, z);

            body.addEventListener('collide', (e) => {
                if (e.contact.getImpactVelocityAlongNormal() > 1.5) {
                    playSound('hit');
                }
            });

            world.addBody(body);
            targets.push({ mesh, body });
        }

        // Throwing Action with Precision
        function throwStone(impulseVector) {
            if (ammo <= 0 || !gameActive) return;

            ammo--;
            document.getElementById('ammo-display').innerText = `الأحجار: ${ammo}`;
            playSound('shoot');

            if (currentStoneMesh) {
                scene.remove(currentStoneMesh);
                currentStoneMesh = null;
            }

            // Stone Projectile Mesh
            const geo = new THREE.DodecahedronGeometry(0.42, 1);
            const mat = new THREE.MeshStandardMaterial({ color: 0x7f8c8d, roughness: 0.95 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Sphere(0.42);
            const body = new CANNON.Body({ mass: 4.5, shape: shape });
            body.position.copy(slingPos);
            body.velocity.set(impulseVector.x, impulseVector.y, impulseVector.z);
            world.addBody(body);

            activeStones.push({ mesh, body });

            // Check results after motion settled
            setTimeout(checkGameStatus, 3200);
        }

        // Touch and Mouse Controls for Accurate Aiming
        function setupInput() {
            const container = document.getElementById('game-container');

            const onStart = (e) => {
                if (!gameActive || ammo <= 0) return;
                isDragging = true;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                dragStart = { x: clientX, y: clientY };
                dragCurrent = { x: clientX, y: clientY };
            };

            const onMove = (e) => {
                if (!isDragging) return;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                dragCurrent = { x: clientX, y: clientY };
                updateTrajectory();
            };

            const onEnd = () => {
                if (!isDragging) return;
                isDragging = false;
                clearTrajectory();

                const dx = dragStart.x - dragCurrent.x;
                const dy = dragStart.y - dragCurrent.y; // السحب للأسفل يولد طاقة إطلاق للأمام

                if (dy > 15) {
                    const forceX = dx * 0.09;
                    const forceY = Math.min(dy * 0.14, 28);
                    const forceZ = -Math.min(dy * 0.28, 45);
                    throwStone(new THREE.Vector3(forceX, forceY, forceZ));
                } else {
                    // إذا لم يسحب كافياً، أعد الحجر لمكانه المرئي
                    if (!currentStoneMesh) spawnReadyStone();
                }
            };

            container.addEventListener('mousedown', onStart);
            container.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            container.addEventListener('touchstart', onStart);
            container.addEventListener('touchmove', onMove);
            window.addEventListener('touchend', onEnd);
        }

        // Trajectory Line Simulation
        function updateTrajectory() {
            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;

            if (dy <= 0) {
                clearTrajectory();
                if (currentStoneMesh) currentStoneMesh.position.copy(slingPos);
                return;
            }

            const vx = dx * 0.09;
            const vy = Math.min(dy * 0.14, 28);
            const vz = -Math.min(dy * 0.28, 45);

            // تحريك الحجر المرئي للخلف قليلاً أثناء الشد للتفاعل البصري
            if (currentStoneMesh) {
                currentStoneMesh.position.set(
                    slingPos.x + (dx * 0.002),
                    Math.max(0.4, slingPos.y - (dy * 0.003)),
                    slingPos.y + Math.min(1.5, dy * 0.01)
                );
            }

            const points = [];
            let px = slingPos.x, py = slingPos.y, pz = slingPos.z;
            let simVx = vx / 4.5, simVy = vy / 4.5, simVz = vz / 4.5;

            for (let t = 0; t < 35; t++) {
                points.push(new THREE.Vector3(px, py, pz));
                px += simVx * 0.1;
                py += simVy * 0.1 - 0.5 * 9.8 * 0.01;
                pz += simVz * 0.1;
                simVy -= 9.8 * 0.02;
                if (py < 2.5) break; // اصطدام افتراضي بالطاولة
            }

            trajectoryLine.geometry.dispose();
            trajectoryLine.geometry = new THREE.BufferGeometry().setFromPoints(points);
            trajectoryLine.computeLineDistances();
            trajectoryLine.visible = true;
        }

        function clearTrajectory() {
            trajectoryLine.visible = false;
        }

        // Game State Validation
        function checkGameStatus() {
            if (!gameActive) return;

            let knockedDown = 0;
            targets.forEach(t => {
                if (t.body.position.y < 2.25) { // سقطت عن الميز
                    knockedDown++;
                }
            });

            if (knockedDown === targets.length) {
                // Win Condition
                gameActive = false;
                playSound('win');
                const randomWinMsg = winMessages[Math.floor(Math.random() * winMessages.length)];
                
                // الانتقال التلقائي للمرحلة التالية بضغط "ابدأ اللعبة"
                showModal('فوز ساحق! 🎉', randomWinMsg, 'ابدأ اللعبة 🚀', () => {
                    hideModal();
                    loadLevel(currentLevel + 1);
                });
            } else if (ammo === 0) {
                const stillMoving = activeStones.some(s => s.body.velocity.length() > 0.4);
                if (!stillMoving) {
                    // Fail Condition (عند اكتمال الاحجار ونفادها يظهر اشعار الخسارة وزر الاعادة)
                    gameActive = false;
                    playSound('fail');
                    showModal('انتهت الأحجار! 💥', failMessage, 'إعادة المحاولة 🔄', () => {
                        hideModal();
                        loadLevel(currentLevel);
                    });
                } else {
                    setTimeout(checkGameStatus, 1500);
                }
            } else {
                // إعداد حجر جديد في المدفع للرمية التالية
                if (!currentStoneMesh && gameActive) {
                    spawnReadyStone();
                }
            }
        }

        function showModal(title, msg, btnText, action) {
            const modal = document.getElementById('result-modal');
            document.getElementById('modal-title').innerText = title;
            const msgElem = document.getElementById('modal-msg');
            msgElem.innerText = msg;
            msgElem.className = 'modal-msg ' + (title.includes('فوز') ? 'win-msg' : '');

            const btn = document.getElementById('modal-btn');
            btn.innerText = btnText;
            btn.onclick = action;

            modal.classList.add('active');
        }

        function hideModal() {
            document.getElementById('result-modal').classList.remove('active');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);

            world.step(1 / 60);

            targets.forEach(t => {
                t.mesh.position.copy(t.body.position);
                t.mesh.quaternion.copy(t.body.quaternion);
            });

            activeStones.forEach(s => {
                s.mesh.position.copy(s.body.position);
                s.mesh.quaternion.copy(s.body.quaternion);
            });

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
